<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b1326'/%3E%3Crect x='25' y='35' width='50' height='30' fill='none' stroke='%23ddb7ff' stroke-width='6'/%3E%3Cpath d='M18 72h64l6 10H12z' fill='%23a855f7'/%3E%3C/svg%3E"/>
<title>Page Not Found - Laptop Point</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="assets/css/animations.css"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    body { background-color: #0b1326; color: #dae2fd; font-family: 'Inter', sans-serif; overflow: hidden; }
    .glass-panel { background: rgba(45, 52, 73, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    .glitch { animation: glitch 3s infinite; }
    @keyframes glitch {
        0%, 90%, 100% { text-shadow: 2px 0 #a855f7, -2px 0 #3b82f6; }
        92% { text-shadow: -3px 0 #a855f7, 3px 0 #3b82f6; }
        94% { text-shadow: 3px 2px #a855f7, -3px -2px #3b82f6; }
        96% { text-shadow: -2px 3px #a855f7, 2px -3px #3b82f6; }
        98% { text-shadow: 2px -1px #a855f7, -2px 1px #3b82f6; }
    }
    #particles-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .orb { position: fixed; border-radius: 50%; filter: blur(80px); z-index: 0; pointer-events: none; }
    .orb-1 { width: 400px; height: 400px; background: rgba(168,85,247,0.12); top: 10%; left: 10%; animation: float-orb 8s ease-in-out infinite; }
    .orb-2 { width: 300px; height: 300px; background: rgba(59,130,246,0.1); bottom: 15%; right: 10%; animation: float-orb 10s ease-in-out infinite reverse; }
    @keyframes float-orb { 0%,100% { transform: translate(0,0); } 50% { transform: translate(30px, -20px); } }
</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
<canvas id="particles-canvas"></canvas>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<main class="text-center max-w-lg relative z-10" role="main">
    <div class="mb-6 animate-float">
        <span class="material-symbols-outlined text-[100px] text-white/10">explore</span>
    </div>
    <h1 class="brand text-8xl font-extrabold text-[#ddb7ff] tracking-tighter glitch mb-4 animate-fade-in-up" style="animation-delay:0.1s">404</h1>
    <h2 class="text-xl font-semibold mb-3 animate-fade-in-up" style="animation-delay:0.2s">Page Not Found</h2>
    <p class="text-white/50 mb-8 leading-relaxed animate-fade-in-up" style="animation-delay:0.3s">
        The page you're looking for doesn't exist or has been moved. Let's get you back on track.
    </p>
    <div class="flex flex-col sm:flex-row gap-3 justify-center animate-fade-in-up" style="animation-delay:0.4s">
        <a href="index.html" class="bg-gradient-to-r from-[#a855f7] to-[#3b82f6] text-white px-6 py-3 rounded-lg font-medium uppercase tracking-wider text-sm hover:shadow-[0_0_20px_rgba(168,85,247,0.4)] transition-all text-center">Back to Home</a>
        <a href="shop.html?type=laptops" class="border border-white/20 text-white/70 px-6 py-3 rounded-lg font-medium uppercase tracking-wider text-sm hover:bg-white/5 transition-all text-center">Browse Shop</a>
    </div>
    <div class="mt-10 glass-panel rounded-xl p-5 text-left animate-fade-in-up" style="animation-delay:0.5s">
        <h3 class="text-xs uppercase tracking-wider text-white/40 mb-3">Quick Links</h3>
        <div class="grid grid-cols-2 gap-2">
            <a href="shop.html?type=laptops" class="text-sm text-white/40 hover:text-white/70 transition-colors flex items-center gap-1.5"><span class="material-symbols-outlined text-sm">laptop_mac</span>Laptops</a>
            <a href="shop.html?type=accessories" class="text-sm text-white/40 hover:text-white/70 transition-colors flex items-center gap-1.5"><span class="material-symbols-outlined text-sm">keyboard</span>Accessories</a>
            <a href="cart.html" class="text-sm text-white/40 hover:text-white/70 transition-colors flex items-center gap-1.5"><span class="material-symbols-outlined text-sm">shopping_cart</span>Cart</a>
            <a href="account.html" class="text-sm text-white/40 hover:text-white/70 transition-colors flex items-center gap-1.5"><span class="material-symbols-outlined text-sm">person</span>My Account</a>
        </div>
    </div>
</main>

<script>
(function() {
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    function create() {
        particles = [];
        const count = Math.min(Math.floor((canvas.width * canvas.height) / 15000), 40);
        for (let i = 0; i < count; i++) {
            particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3, r: Math.random()*1.5+0.5, a: Math.random()*0.3+0.05 });
        }
    }
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            p.x += p.vx; p.y += p.vy;
            if (p.x < 0) p.x = canvas.width; if (p.x > canvas.width) p.x = 0;
            if (p.y < 0) p.y = canvas.height; if (p.y > canvas.height) p.y = 0;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
            ctx.fillStyle = `rgba(168,85,247,${p.a})`; ctx.fill();
        });
        requestAnimationFrame(draw);
    }
    resize(); create(); draw();
    window.addEventListener('resize', () => { resize(); create(); });
})();
</script>
</body>
</html>
