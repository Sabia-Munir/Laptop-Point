<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_3 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_3" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_3');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js Scene: Rotating 3D Laptop
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Simple Laptop Model using primitives
const laptopGroup = new THREE.Group();

// Screen (Top part)
const screenGeometry = new THREE.BoxGeometry(4, 2.5, 0.1);
const screenMaterial = new THREE.MeshPhongMaterial({ 
    color: 0x111111,
    emissive: 0x3b82f6,
    emissiveIntensity: 0.2
});
const screen = new THREE.Mesh(screenGeometry, screenMaterial);
screen.position.y = 1.25;
laptopGroup.add(screen);

// Screen Content (Glow)
const contentGeometry = new THREE.PlaneGeometry(3.8, 2.3);
const contentMaterial = new THREE.MeshBasicMaterial({ 
    color: 0xa855f7,
    transparent: true,
    opacity: 0.8
});
const content = new THREE.Mesh(contentGeometry, contentMaterial);
content.position.z = 0.06;
content.position.y = 1.25;
laptopGroup.add(content);

// Keyboard/Base (Bottom part)
const baseGeometry = new THREE.BoxGeometry(4, 0.2, 2.5);
const baseMaterial = new THREE.MeshPhongMaterial({ color: 0x222222 });
const base = new THREE.Mesh(baseGeometry, baseMaterial);
base.position.y = 0;
laptopGroup.add(base);

scene.add(laptopGroup);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0xa855f7, 1, 10);
pointLight.position.set(2, 2, 2);
scene.add(pointLight);

const blueLight = new THREE.PointLight(0x3b82f6, 1, 10);
blueLight.position.set(-2, 2, 2);
scene.add(blueLight);

// Animation logic
let scrollY = 0;
window.addEventListener('scroll', () => {
    scrollY = window.scrollY;
});

function animate() {
    requestAnimationFrame(animate);
    
    // Rotation based on time + scroll
    laptopGroup.rotation.y += 0.01;
    laptopGroup.rotation.x = Math.sin(Date.now() * 0.001) * 0.1 + (scrollY * 0.001);
    
    renderer.render(scene, camera);
}

// Handle Resize
window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_3 -->
</body>
</html>
