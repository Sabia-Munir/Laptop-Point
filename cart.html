<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta name="description" content="Your Laptop Point shopping cart.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b1326'/%3E%3Crect x='25' y='35' width='50' height='30' fill='none' stroke='%23ddb7ff' stroke-width='6'/%3E%3Cpath d='M18 72h64l6 10H12z' fill='%23a855f7'/%3E%3C/svg%3E"/>
<title>Your Cart - Laptop Point</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    body { background-color: #0b1326; color: #dae2fd; font-family: 'Inter', sans-serif; }
    .glass-panel { background: rgba(45, 52, 73, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    .brand { font-family: 'Geist', sans-serif; }
</style>
</head>
<body class="min-h-screen">

<header class="border-b border-white/10 px-6 py-4 flex justify-between items-center">
    <a href="index.html" class="brand text-lg font-extrabold text-[#ddb7ff] tracking-tighter">LAPTOP POINT</a>
</header>

<main class="max-w-3xl mx-auto px-6 py-10">
    <h1 class="text-2xl font-semibold mb-6">Your Cart</h1>

    <div id="empty-cart" class="hidden text-center py-16">
        <p class="text-white/40 mb-4">Your cart is empty.</p>
        <a href="index.html" class="text-sm text-[#c9a6f5] hover:underline">Continue shopping →</a>
    </div>

    <div id="cart-items" class="space-y-4"></div>

    <div id="cart-summary" class="hidden glass-panel rounded-xl p-6 mt-6">
        <div class="flex justify-between text-lg font-semibold mb-4">
            <span>Total</span>
            <span id="cart-total">Rs. 0</span>
        </div>
        <a href="checkout.html" class="block text-center bg-gradient-to-r from-[#a855f7] to-[#3b82f6] text-white py-3 rounded-lg font-medium uppercase tracking-wider text-sm hover:shadow-[0_0_20px_rgba(168,85,247,0.4)] transition-all">
            Proceed to Checkout
        </a>
    </div>
</main>

<script src="assets/js/cart.js"></script>
<script>
    function render() {
        const cart = getCart();
        const container = document.getElementById('cart-items');

        if (cart.length === 0) {
            document.getElementById('empty-cart').classList.remove('hidden');
            document.getElementById('cart-summary').classList.add('hidden');
            container.innerHTML = '';
            return;
        }

        document.getElementById('empty-cart').classList.add('hidden');
        document.getElementById('cart-summary').classList.remove('hidden');

        container.innerHTML = cart.map(item => `
            <div class="glass-panel rounded-xl p-4 flex items-center gap-4">
                <img src="${item.image}" class="w-16 h-16 rounded-lg object-cover"/>
                <div class="flex-1">
                    <div class="font-medium">${item.name}</div>
                    <div class="text-sm text-white/40">Rs. ${item.price.toLocaleString()}</div>
                </div>
                <div class="flex items-center glass-panel rounded-lg">
                    <button class="qty-minus px-3 py-1.5 text-white/70 hover:text-white" data-id="${item.id}">−</button>
                    <span class="px-3 text-sm">${item.quantity}</span>
                    <button class="qty-plus px-3 py-1.5 text-white/70 hover:text-white" data-id="${item.id}">+</button>
                </div>
                <div class="w-24 text-right font-medium">Rs. ${(item.price * item.quantity).toLocaleString()}</div>
                <button class="remove-btn text-white/30 hover:text-red-400" data-id="${item.id}">
                    <span class="material-symbols-outlined">delete</span>
                </button>
            </div>
        `).join('');

        document.getElementById('cart-total').textContent = 'Rs. ' + cartTotal().toLocaleString();

        container.querySelectorAll('.qty-minus').forEach(btn => btn.addEventListener('click', () => {
            const item = getCart().find(i => i.id === btn.dataset.id);
            if (item) updateCartQuantity(btn.dataset.id, item.quantity - 1);
            render();
        }));
        container.querySelectorAll('.qty-plus').forEach(btn => btn.addEventListener('click', () => {
            const item = getCart().find(i => i.id === btn.dataset.id);
            if (item) updateCartQuantity(btn.dataset.id, item.quantity + 1);
            render();
        }));
        container.querySelectorAll('.remove-btn').forEach(btn => btn.addEventListener('click', () => {
            removeFromCart(btn.dataset.id);
            render();
        }));
    }

    document.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
