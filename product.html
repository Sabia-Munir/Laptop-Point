        background: rgba(45, 52, 73, 0.4);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);

    .theme-tint { position: relative; }
    .theme-tint img { filter: saturate(0.85) contrast(1.05) brightness(0.9); }
    .theme-tint::after {
        content: ""; position: absolute; inset: 0;
        background: linear-gradient(135deg, rgba(168, 85, 247, 0.14), rgba(59, 130, 246, 0.08));
        mix-blend-mode: color; pointer-events: none;

    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

<body class="min-h-screen">

    <nav class="hidden md:flex items-center gap-6 text-sm" aria-label="Main navigation">
        <a href="index.html" class="text-white/60 hover:text-white transition-colors">Home</a>
        <a href="shop.html?type=laptops" class="text-white/60 hover:text-white transition-colors">Laptops</a>
        <a href="shop.html?type=accessories" class="text-white/60 hover:text-white transition-colors">Accessories</a>
    </nav>
    <div class="flex items-center gap-5">
        <a id="account-link" href="account.html" class="hidden md:flex items-center gap-1.5 text-sm text-white/60 hover:text-white transition-colors">
            <span class="material-symbols-outlined text-xl">person</span>
            <span id="account-label">Login</span>
        </a>
        <a href="cart.html" class="flex items-center gap-1.5 text-sm text-white/70 hover:text-white transition-colors">
            <span class="material-symbols-outlined text-xl">shopping_cart</span>
            <span id="cart-count" class="text-xs bg-primary/30 text-primary-fixed rounded-full px-1.5 py-0.5 hidden">0</span>
        </a>
    </div>
</header>

<main id="main-content" class="max-w-5xl mx-auto px-6 py-10" role="main">
    <nav aria-label="Breadcrumb" class="mb-6">
        <ol class="flex items-center gap-2 text-xs uppercase tracking-wider">
            <li><a href="index.html" class="text-white/40 hover:text-white/70 transition-colors">Home</a></li>
            <li class="text-white/20">/</li>
            <li id="bc-shop"><a href="shop.html" class="text-white/40 hover:text-white/70 transition-colors">Shop</a></li>
            <li class="text-white/20">/</li>
            <li id="bc-product" class="text-white/60"></li>
        </ol>
    </nav>

    <div id="loading-msg" class="mt-8 grid md:grid-cols-2 gap-10">
        <div><div class="skeleton skeleton-image rounded-xl h-96"></div><div class="flex gap-3 mt-3"><div class="skeleton w-16 h-16 rounded-lg"></div><div class="skeleton w-16 h-16 rounded-lg"></div><div class="skeleton w-16 h-16 rounded-lg"></div></div></div>
        <div class="space-y-4"><div class="skeleton skeleton-text-sm w-24"></div><div class="skeleton skeleton-text w-64 h-8"></div><div class="skeleton skeleton-text-sm w-32"></div><div class="skeleton skeleton-btn mt-6"></div><div class="skeleton skeleton-text mt-6"></div><div class="skeleton skeleton-text-sm"></div></div>
    </div>
    <div id="error-msg" class="text-red-400 text-sm mt-8 hidden">Product not found.</div>

    <div id="product-content" class="hidden grid md:grid-cols-2 gap-10 mt-6">
        <!-- Gallery -->
        <div>
            <div class="theme-tint rounded-xl overflow-hidden glass-panel h-96">
                <img id="main-image" class="w-full h-full object-cover" loading="lazy" src="" alt=""/>
            </div>
            <div id="thumbnail-row" class="flex gap-3 mt-3"></div>
        </div>

        <!-- Info -->
        <div>
            <span id="p-category" class="font-label-sm text-xs text-primary tracking-[0.2em] uppercase"></span>
            <h1 id="p-name" class="font-headline-md text-3xl font-bold text-on-surface mt-2 mb-1"></h1>
            <span id="p-brand" class="text-sm text-white/40"></span>

            <div class="flex items-center gap-3 mt-5">
                <span id="p-price" class="text-2xl font-bold text-tertiary"></span>
                <span id="p-original-price" class="text-sm text-white/40 line-through hidden"></span>
            </div>

            <span id="p-availability" class="inline-block mt-3 px-3 py-1 rounded-full text-xs uppercase tracking-wide"></span>

            <p id="p-description" class="text-white/70 mt-6 leading-relaxed"></p>

            <div id="specs-table" class="glass-panel rounded-xl p-5 mt-6 space-y-2"></div>

            <div class="flex items-center gap-4 mt-8">
                <div class="flex items-center glass-panel rounded-lg">
                    <button id="qty-minus" class="px-3 py-2 text-white/70 hover:text-white">−</button>
                    <span id="qty-value" class="px-3 text-sm">1</span>
                    <button id="qty-plus" class="px-3 py-2 text-white/70 hover:text-white">+</button>
                </div>
                <button id="add-to-cart-btn" class="flex-1 bg-gradient-to-r from-primary-container to-secondary-container text-white py-3 rounded-lg font-medium uppercase tracking-wider text-sm hover:shadow-[0_0_20px_rgba(168,85,247,0.4)] transition-all">
                    Add to Cart
                </button>
                <button id="wishlist-btn" class="wishlist-toggle w-12 h-12 glass-panel rounded-lg flex items-center justify-center text-white/50 hover:text-red-400 transition-colors" data-product-id="">
                    <span class="material-symbols-outlined text-xl">favorite_border</span>
                </button>
            </div>
            <p id="added-msg" class="text-green-400 text-sm mt-3 hidden">Added to cart.</p>
            <div id="delivery-estimate" class="mt-5 glass-panel rounded-lg p-4"></div>
            <div id="share-buttons" class="flex items-center gap-4 mt-5 pt-5 border-t border-white/10"></div>
            <div id="stock-notification"></div>
            <div id="trust-badges" class="mt-6"></div>
        </div>
    </div>
</main>
<footer class="border-t border-white/10 mt-16">
    <div class="max-w-5xl mx-auto px-6 py-8 flex flex-col sm:flex-row justify-between items-center gap-4 text-sm text-white/40">
        <div class="flex items-center gap-4">
            <a href="tel:03115245535" class="flex items-center gap-1.5 hover:text-white/70 transition-colors">

    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/account.js"></script>
<script src="assets/js/toast.js"></script>
<script src="assets/js/recently-viewed.js"></script>
<script src="assets/js/wishlist.js"></script>
<script src="assets/js/delivery-estimate.js"></script>
<script src="assets/js/share.js"></script>
<script src="assets/js/stock-alert.js"></script>
<script src="assets/js/trust-badges.js"></script>
<script src="assets/js/footer.js"></script>
<script src="assets/js/scroll-to-top.js"></script>
<script src="assets/js/scroll-reveal.js"></script>
<script src="assets/js/ripple.js"></script>
<script src="assets/js/blur-load.js"></script>
<script src="assets/js/counter.js"></script>
<script src="assets/js/page-transition.js"></script>
<script>
    const availabilityStyle = {
        in_stock: 'bg-green-500/15 text-green-400',
        low_stock: 'bg-yellow-500/15 text-yellow-400',
        out_of_stock: 'bg-red-500/15 text-red-400',
    };
    const availabilityText = {
        in_stock: 'In Stock', low_stock: 'Low Stock', out_of_stock: 'Out of Stock',
    };
    const specLabels = { processor: 'Processor', ram: 'RAM', storage: 'Storage', screen: 'Screen' };

    let currentProduct = null;
    let qty = 1;

    async function loadProduct() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        if (!id) {
            showError();
            return;
        }

        const { data: product, error } = await supabaseClient
            .from('public_products')
            .select('*')
            .eq('id', id)
            .single();

        if (error || !product) {
            showError();
            return;
        }

        currentProduct = product;
        renderProduct(product);
        trackRecentlyViewed(product);
    }

    function showError() {
        document.getElementById('loading-msg').innerHTML = '';
        document.getElementById('loading-msg').classList.add('hidden');
        document.getElementById('error-msg').classList.remove('hidden');
    }

    function renderProduct(p) {
        document.getElementById('loading-msg').innerHTML = '';
        document.getElementById('loading-msg').classList.add('hidden');
        document.getElementById('product-content').classList.remove('hidden');

        document.title = p.name + ' - Laptop Point';
        
        // Update breadcrumb
        const bcShop = document.getElementById('bc-shop');
        const bcProduct = document.getElementById('bc-product');
        if (bcShop) {
            const shopUrl = p.category === 'laptop' ? 'shop.html?type=laptops' : 'shop.html?type=accessories';
            bcShop.innerHTML = '<a href="' + shopUrl + '" class="text-white/40 hover:text-white/70 transition-colors">' + (p.category === 'laptop' ? 'Laptops' : 'Accessories') + '</a>';
        }
        if (bcProduct) bcProduct.textContent = p.name;
        
        document.getElementById('p-category').textContent = p.category;
        document.getElementById('p-name').textContent = p.name;
        document.getElementById('p-brand').textContent = p.brand || '';
        document.getElementById('p-description').textContent = p.description || '';
        document.getElementById('wishlist-btn').dataset.productId = p.id;
        updateWishlistButtons();
        renderDeliveryEstimate('delivery-estimate', 'islamabad');
        renderShareButtons('share-buttons', window.location.href, p.name + ' - Laptop Point');
        renderStockNotification('stock-notification', p.id, p.name, p.availability);
        renderTrustBadges('trust-badges');

        const priceEl = document.getElementById('p-price');
        const originalEl = document.getElementById('p-original-price');
        if (p.discount_price) {
            priceEl.textContent = 'Rs. ' + Number(p.discount_price).toLocaleString();
            originalEl.textContent = 'Rs. ' + Number(p.price).toLocaleString();
            originalEl.classList.remove('hidden');
        } else {
            priceEl.textContent = 'Rs. ' + Number(p.price).toLocaleString();
        }

        const availEl = document.getElementById('p-availability');
        availEl.textContent = availabilityText[p.availability] || '';
        availEl.className = 'inline-block mt-3 px-3 py-1 rounded-full text-xs uppercase tracking-wide ' + (availabilityStyle[p.availability] || '');

        const images = (p.images && p.images.length) ? p.images : [''];
        document.getElementById('main-image').src = images[0];
        document.getElementById('main-image').alt = p.name;

        const thumbRow = document.getElementById('thumbnail-row');
        thumbRow.innerHTML = images.map((img, i) =>
            `<button class="thumb w-16 h-16 rounded-lg overflow-hidden glass-panel ${i === 0 ? 'ring-2 ring-primary' : ''}" data-src="${img}">
                <img src="${img}" loading="lazy" class="w-full h-full object-cover"/>
            </button>`
        ).join('');
        thumbRow.querySelectorAll('.thumb').forEach(btn => {
            btn.addEventListener('click', () => {
                document.getElementById('main-image').src = btn.dataset.src;
                thumbRow.querySelectorAll('.thumb').forEach(b => b.classList.remove('ring-2', 'ring-primary'));
                btn.classList.add('ring-2', 'ring-primary');
            });
        });

        const specs = p.specs || {};
        const specsTable = document.getElementById('specs-table');
        const rows = Object.entries(specs).filter(([k, v]) => v);
        specsTable.innerHTML = rows.length
            ? rows.map(([k, v]) => `
                <div class="flex justify-between text-sm border-b border-white/5 pb-2 last:border-0 last:pb-0">
                    <span class="text-white/40">${specLabels[k] || k}</span>
                    <span class="text-white/90">${v}</span>
                </div>`).join('')
            : '<span class="text-white/30 text-sm">No specs listed.</span>';

        if (p.availability === 'out_of_stock') {
            document.getElementById('add-to-cart-btn').disabled = true;
            document.getElementById('add-to-cart-btn').classList.add('opacity-40', 'cursor-not-allowed');
            document.getElementById('add-to-cart-btn').textContent = 'Out of Stock';
        }
    }

    document.getElementById('qty-minus').addEventListener('click', () => {
        if (qty > 1) { qty--; document.getElementById('qty-value').textContent = qty; }
    });
    document.getElementById('qty-plus').addEventListener('click', () => {
        qty++; document.getElementById('qty-value').textContent = qty;
    });

    document.getElementById('add-to-cart-btn').addEventListener('click', () => {
        if (!currentProduct || currentProduct.availability === 'out_of_stock') return;
        addToCart(currentProduct, qty);
        document.getElementById('added-msg').classList.remove('hidden');
        updateCartCount();
        if (typeof Toast !== 'undefined') {
            Toast.success(`${currentProduct.name} added to cart`);
        }
    });

    document.getElementById('wishlist-btn').addEventListener('click', () => {
        if (currentProduct) toggleWishlist(currentProduct);
    });

    document.addEventListener('DOMContentLoaded', () => {
        loadProduct();
        updateCartCount();
        updateAccountLink();
    });
</script>
</body>
</html>
